url: https://github.com/john-walks-slow/dsh-set-model
name: john-walks-slow/dsh-set-model
category: model
description:
  en: 'Through the TypeSafe Jev decision model or through its own tool calls, the agent switches model presets and thinking depth on its own, following the task at hand. Jev reads the latest instruction at the start of each turn and classifies the task — deep reasoning for hard debugging, the cost-effective tier for routine work — while the agent may also call set_model / list_models itself, with a mandatory switch reason. A preset may declare reasoning effort only, so one model can retune its own thinking depth. Also switch_preset / list_presets for preset-only switching, a provider whitelist and a context-window token-pressure guard, the active model injected into runtime context, Plan Mode auto-transition, and a bundled Web settings page.'
  zh: '通过 TypeSafe Jev 决策模型或调模工具调用，让 Agent 根据任务场景自主切换模型预设和思考深度：Jev 每轮开局读取最新指令判断任务类型（疑难升到高推理档位、日常回到高性价比档位），Agent 也可自行调用 set_model / list_models 切换 provider、model 与 reasoningEffort（思考深度，强制附带切换理由）。档位可只声明思考强度，从而在同一模型上调节思考深度；另含 switch_preset / list_presets 档位切换、Provider 白名单与上下文窗口 Token 水位护栏、活跃模型注入运行时上下文、Plan 规划模式自动升降级，以及插件自带设置页。'
