url: https://github.com/john-walks-slow/dsh-set-model
name: john-walks-slow/dsh-set-model
category: model
description:
  en: 'Model policy for DeepSeek Harness: the TypeSafe Jev decision model reads the latest instruction at the start of each turn, classifies the task and auto-switches between the declared model presets — deep reasoning for hard debugging, the cost-effective tier for routine work — while a preset that declares reasoning effort only retunes thinking depth on the same model. Also set_model / list_models tools for the agent to switch provider, model or reasoning effort itself with a mandatory reason, switch_preset / list_presets for preset-only switching, a provider whitelist and a context-window token-pressure guard, the active model injected into runtime context, Plan Mode auto-transition, and a bundled Web settings page.'
  zh: '为 DSH 提供模型策略：接入 TypeSafe Jev 决策模型，每轮对话开局读取最新指令判断任务类型，自动在声明的档位间切换模型（疑难升到高推理档位、日常回到高性价比档位），档位可只声明思考强度，从而在同一模型上自动调节思考深度；另含 set_model / list_models 两个 Agent 工具让模型按任务难度自主切换 provider、model 与 reasoningEffort（思考深度，强制附带切换理由）、switch_preset / list_presets 档位切换、Provider 白名单与上下文窗口 Token 水位护栏、活跃模型注入运行时上下文、Plan 规划模式自动升降级，以及插件自带设置页。'
