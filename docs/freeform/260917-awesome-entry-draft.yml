url: https://github.com/john-walks-slow/dsh-set-model
name: john-walks-slow/dsh-set-model
category: model
description:
  en: 'Model policy for DeepSeek Harness: the agent switches model presets and thinking depth on its own, following the task at hand — driven by the TypeSafe Jev decision model, which reads the latest instruction at the start of each turn and classifies the task (deep reasoning for hard debugging, the cost-effective tier for routine work), or by the agent calling the model tools itself. A preset may declare reasoning effort only, so one model can retune its own thinking depth. Includes set_model / list_models tools with a mandatory switch reason, switch_preset / list_presets for preset-only switching, a provider whitelist and a context-window token-pressure guard, the active model injected into runtime context, Plan Mode auto-transition, and a bundled Web settings page.'
  zh: '为 DSH 提供模型策略：由 TypeSafe Jev 决策模型或调模工具驱动，让 Agent 按任务场景自主切换模型预设与思考深度——Jev 每轮开局读取最新指令判断任务类型（疑难升到高推理档位、日常回到高性价比档位），Agent 也可自行调用 set_model / list_models 切换 provider、model 与 reasoningEffort（思考深度，强制附带切换理由）。档位可只声明思考强度，从而在同一模型上调节思考深度；另含 switch_preset / list_presets 档位切换、Provider 白名单与上下文窗口 Token 水位护栏、活跃模型注入运行时上下文、Plan 规划模式自动升降级，以及插件自带设置页。'
